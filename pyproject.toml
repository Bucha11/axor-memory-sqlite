[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axor-memory-sqlite"
version = "0.3.0"
description = "SQLite memory provider for axor-core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["axor", "memory", "sqlite", "agents"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Database",
	"Topic :: Software Development :: Libraries",
]
dependencies = [
    # Ceiling raised to <0.13. 0.12's breaking changes are STRICT-only and
    # nothing here constructs a STRICT governor; measured against an installed
    # 0.12.0 — 16 tests pass. The floor is unchanged: this bump widens what may
    # resolve, it does not claim the versions between were re-measured.
    "axor-core>=0.6.0,<0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Repository = "https://github.com/Bucha11/axor-memory-sqlite"
"Bug Tracker" = "https://github.com/Bucha11/axor-memory-sqlite/issues"
Changelog = "https://github.com/Bucha11/axor-memory-sqlite/releases"

[tool.hatch.build.targets.wheel]
packages = ["axor_memory_sqlite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
